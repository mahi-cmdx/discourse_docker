## CMDX Community: standalone container that builds from the private
## CMDxAI/CMDX-Community repository instead of upstream Discourse.
##
## Setup guide: docs/INSTALL-cloud.md in CMDxAI/CMDX-Community
##
## Copy to containers/app.yml, fill in the TODOs, then:
##   /var/discourse/launcher rebuild app
##
## BE *VERY* CAREFUL WHEN EDITING!
## YAML FILES ARE SUPER SUPER SENSITIVE TO MISTAKES IN WHITESPACE OR ALIGNMENT!

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  - "templates/web.ssl.template.yml"
  - "templates/web.letsencrypt.ssl.template.yml"

expose:
  - "80:80" # http
  - "443:443" # https

params:
  db_default_text_search_config: "pg_catalog.english"

  ## Max 25% of total memory: "1GB" for a 4 GB droplet, "256MB" for 2 GB
  db_shared_buffers: "1GB"

  ## Branch of CMDxAI/CMDX-Community to deploy
  version: whitelabel

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8

  ## 4 for a 4 GB / 2 vCPU droplet, 2 for 2 GB
  UNICORN_WORKERS: 4

  ## TODO: domain this site answers on (an A record must point at this server)
  DISCOURSE_HOSTNAME: "community.example.com"

  ## TODO: comma-separated emails that become admins on first signup
  DISCOURSE_DEVELOPER_EMAILS: "admin@example.com"

  ## TODO: SMTP. DigitalOcean blocks ports 25/465/587 on new droplets, so use 2525.
  DISCOURSE_SMTP_ADDRESS: smtp.example.com
  DISCOURSE_SMTP_PORT: 2525
  DISCOURSE_SMTP_USER_NAME: user@example.com
  DISCOURSE_SMTP_PASSWORD: "pa$$word"
  DISCOURSE_SMTP_ENABLE_START_TLS: true
  DISCOURSE_NOTIFICATION_EMAIL: noreply@example.com

  ## TODO: Let's Encrypt account email
  LETSENCRYPT_ACCOUNT_EMAIL: admin@example.com

## The Docker container is stateless; all data is stored in /shared
volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

hooks:
  ## Fetch code from CMDxAI/CMDX-Community. The read-only GitHub token lives in
  ## /var/discourse/shared/standalone/github-token (root-only), so it never appears
  ## in this file or in the build output. Plugins are bundled in the repository.
  before_code:
    - exec:
        cd: $home
        cmd:
          - sudo -H -E -u discourse git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          - bash -c 'sudo -H -u discourse git remote set-url origin "https://x-access-token:$(cat /shared/github-token)@github.com/CMDxAI/CMDX-Community.git"'

run:
  - exec: echo "Beginning of custom commands"
  - exec: echo "End of custom commands"
